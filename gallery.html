<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leo &amp; Lily — Galeri</title>
<meta name="description" content="Galeri foto Leo &amp; Lily.">
<meta name="theme-color" content="#0F1C16">
<meta name="robots" content="noindex">

<!--
==================================================================
  GALERI 3D — dinding foto yang mengikuti kemiringan perangkat

  Halaman ini BERDIRI SENDIRI. Jangan menambahkan tautan apa pun ke
  index.html: halaman ini justru tujuan pengalihan bagi pengunjung
  tanpa kode undangan.

  Foto diambil dari folder foto/ yang sama dengan undangan.
  Tanpa pustaka eksternal. Animasi murni transform CSS.
==================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Italiana&family=Jost:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#F9FBF6;
  --ink-dim:rgba(232,240,230,.62);
  --claret:#2E5140;
  --claret-deep:#0F1C16;
  --gold:#55785B;
  --gold-2:#C6DBC3;
  --f-display:'Italiana',serif;
  --f-body:'Cormorant Garamond',Georgia,serif;
  --f-util:'Jost',system-ui,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--claret-deep);
  color:#E8F0E6;
  font-family:var(--f-body);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- LATAR VIDEO ---------- */
.latar{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--claret-deep)}
.latar__vid{
  position:absolute;top:50%;left:50%;
  min-width:100%;min-height:100%;
  width:auto;height:auto;
  transform:translate(-50%,-50%) scale(1.08);
  object-fit:cover;
  /* saturate & brightness jauh lebih murah daripada blur di GPU ponsel.
     Kalau ingin buram, buram-kan berkas videonya, bukan lewat CSS. */
  filter:saturate(.7) brightness(.42);
}
/* Tirai gelap: video jadi suasana, bukan tontonan yang berebut perhatian */
.latar__tirai{
  position:absolute;inset:0;
  background:
    radial-gradient(120% 90% at 50% 8%,rgba(126,168,131,.2),transparent 62%),
    linear-gradient(180deg,rgba(15,28,22,.72),rgba(15,28,22,.86));
}

/* ---------- PANGGUNG ---------- */
.stage{
  position:fixed;inset:0;z-index:1;
  overflow:hidden;
  perspective:1000px;
  perspective-origin:50% 45%;
  background:transparent;
}

/* Dinding sengaja lebih besar dari layar; kemiringan menyingkap tepinya. */
.wall{
  position:absolute;
  top:50%;left:50%;
  width:132%;
  transform-style:preserve-3d;
  transform:translate(-50%,-50%);
  will-change:transform;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:clamp(8px,2.2vw,16px);
  padding:clamp(8px,2.2vw,16px);
}

.tile{
  position:relative;
  overflow:hidden;
  aspect-ratio:var(--ar,4/5);
  transform:translateZ(var(--z,0px));
  transform-style:preserve-3d;
  background:rgba(255,255,255,.04);
  box-shadow:0 16px 44px rgba(0,0,0,.6);
  cursor:pointer;
}
.tile img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
}
/* Kilau tipis supaya tiap bidang terbaca sebagai permukaan, bukan stiker */
.tile::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(145deg,rgba(255,255,255,.12),transparent 42%,rgba(8,16,12,.3));
  pointer-events:none;
}
.tile--tall{grid-row:span 2;--ar:4/7}
.tile--wide{grid-column:span 2;--ar:16/9}

/* Gelap di tepi layar, supaya pandangan jatuh ke tengah */
.vignette{
  position:fixed;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(75% 60% at 50% 45%,transparent 40%,rgba(8,16,12,.78) 100%);
}

/* ---------- JUDUL & PETUNJUK ---------- */
.kepala{
  position:fixed;left:0;right:0;top:0;z-index:10;
  padding:calc(22px + env(safe-area-inset-top)) 20px 20px;
  text-align:center;pointer-events:none;
  background:linear-gradient(180deg,rgba(15,28,22,.82),transparent);
}
.kepala__eye{
  font-family:var(--f-util);font-size:10px;letter-spacing:.34em;
  text-transform:uppercase;color:var(--gold-2);margin:0 0 6px;opacity:.85;
}
.kepala__nama{
  font-family:var(--f-display);font-size:clamp(30px,9vw,44px);
  line-height:1;margin:0;color:#FBFDF9;
}
.kepala__amp{font-family:var(--f-body);font-style:italic;font-size:.5em;color:var(--gold-2)}

.kaki{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom));
  text-align:center;
  background:linear-gradient(0deg,rgba(15,28,22,.85),transparent);
}
.petunjuk{
  font-family:var(--f-util);font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-dim);margin:0;
  transition:opacity .6s ease;
}
.petunjuk.is-pudar{opacity:0}

.btn{
  display:inline-flex;align-items:center;gap:9px;
  font-family:var(--f-util);font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  padding:13px 24px;border:1px solid rgba(198,219,195,.5);
  background:rgba(15,28,22,.5);color:var(--gold-2);border-radius:2px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  transition:background .3s ease,color .3s ease;
}
.btn:hover,.btn:focus-visible{background:var(--gold-2);color:#0F1C16}
.btn svg{width:15px;height:15px}
.btn[hidden]{display:none}

/* ---------- LIHAT SATU FOTO ---------- */
.lihat{
  position:fixed;inset:0;z-index:20;display:none;
  align-items:center;justify-content:center;padding:18px;
}
.lihat.is-open{display:flex}
.lihat__bg{
  position:absolute;inset:0;background:rgba(8,16,12,.9);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  opacity:0;transition:opacity .3s ease;
}
.lihat.is-in .lihat__bg{opacity:1}
.lihat__gbr{
  position:relative;max-width:100%;max-height:100%;
  object-fit:contain;border:1px solid rgba(198,219,195,.25);
  opacity:0;transform:scale(.96);
  transition:opacity .3s ease,transform .3s ease;
}
.lihat.is-in .lihat__gbr{opacity:1;transform:none}
.lihat__tutup{
  position:absolute;top:calc(10px + env(safe-area-inset-top));right:14px;
  width:40px;height:40px;border:0;background:none;
  color:rgba(232,240,230,.75);font-size:28px;line-height:1;z-index:2;
}

:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}

@media (min-width:760px){
  .wall{width:92%;max-width:1040px;grid-template-columns:repeat(4,1fr)}
}

/* Hormati preferensi sistem: tanpa gerak, tampilkan dinding diam. */
@media (prefers-reduced-motion:reduce){
  .latar__vid{display:none}
  .wall{transform:translate(-50%,-50%)!important;width:100%}
  .tile{transform:none!important}
  *{transition-duration:.001ms!important}
}
</style>
</head>

<body>

<!-- GANTI VIDEO LATAR: berkas di folder video/, poster di folder foto/.
     src sengaja ditunda lewat data-src supaya foto terunduh lebih dulu. -->
<div class="latar">
  <video id="latarVid" class="latar__vid" muted loop playsinline
         preload="none" poster="foto/video-poster.jpg"
         data-src="video/teaser.mp4" aria-hidden="true" tabindex="-1"></video>
  <div class="latar__tirai"></div>
</div>

<div class="stage" id="stage">
  <div class="wall" id="wall">
    <!-- GANTI FOTO: samakan dengan isi folder foto/ -->
    <figure class="tile" style="--z:40px"><img src="foto/4.jpg" alt="" decoding="async"></figure>
    <figure class="tile tile--tall" style="--z:-30px"><img src="foto/5.jpg" alt="" decoding="async"></figure>
    <figure class="tile" style="--z:70px"><img src="foto/leo.jpg" alt="" decoding="async"></figure>

    <figure class="tile" style="--z:-60px"><img src="foto/6.jpg" alt="" decoding="async"></figure>
    <figure class="tile" style="--z:20px"><img src="foto/lily.jpg" alt="" decoding="async"></figure>

    <figure class="tile tile--wide" style="--z:55px"><img src="foto/3.jpg" alt="" decoding="async"></figure>
    <figure class="tile" style="--z:-45px"><img src="foto/7.jpg" alt="" decoding="async"></figure>

    <figure class="tile" style="--z:30px"><img src="foto/8.jpg" alt="" decoding="async"></figure>
    <figure class="tile tile--tall" style="--z:-20px"><img src="foto/footer.jpg" alt="" decoding="async"></figure>
    <figure class="tile" style="--z:65px"><img src="foto/0.jpg" alt="" decoding="async"></figure>
  </div>
</div>

<div class="vignette"></div>

<header class="kepala">
  <p class="kepala__eye">Our Moments</p>
  <h1 class="kepala__nama">Leo <span class="kepala__amp">&amp;</span> Lily</h1>
</header>

<footer class="kaki">
  <p class="petunjuk" id="petunjuk">Miringkan perangkat Anda</p>
  <button class="btn" id="izinGerak" type="button" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="6" y="2.5" width="12" height="19" rx="2"/><path d="M12 18.5h.01"/></svg>
    Aktifkan Gerak
  </button>
</footer>

<div class="lihat" id="lihat" role="dialog" aria-modal="true" aria-label="Foto diperbesar">
  <div class="lihat__bg" data-tutup></div>
  <button class="lihat__tutup" type="button" data-tutup aria-label="Tutup">&times;</button>
  <img class="lihat__gbr" id="lihatGbr" alt="">
</div>

<script>
(function(){
  'use strict';

  var $ = function(s){ return document.querySelector(s); };
  var wall     = $('#wall');
  var petunjuk = $('#petunjuk');
  var diamSaja = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Mesin gerak ----------
     Nilai sasaran diperbarui oleh sensor atau tetikus; yang dilukis ke
     layar dikejar perlahan (lerp) supaya halus dan tidak menyentak.
     Hanya satu properti transform yang disentuh tiap frame — inilah yang
     membuatnya tetap ringan di HP kelas menengah. */
  var sX = 0, sY = 0;        // sasaran
  var kX = 0, kY = 0;        // keadaan sekarang
  var jalan = false;
  var BATAS = 9;             // derajat kemiringan maksimum

  function jepit(v, b){ return v < -b ? -b : (v > b ? b : v); }

  function frame(){
    if(!jalan) return;
    kX += (sX - kX) * 0.075;
    kY += (sY - kY) * 0.075;

    // Geser sedikit berlawanan arah supaya terasa seperti melongok
    var gx = (-kY / BATAS) * 2.4;
    var gy = ( kX / BATAS) * 2.4;

    wall.style.transform =
      'translate(-50%,-50%) translate(' + gx.toFixed(2) + '%,' + gy.toFixed(2) + '%) ' +
      'rotateX(' + kX.toFixed(2) + 'deg) rotateY(' + kY.toFixed(2) + 'deg)';

    requestAnimationFrame(frame);
  }

  function mulaiGerak(){
    if(jalan || diamSaja) return;
    jalan = true;
    requestAnimationFrame(frame);
  }

  function sembunyikanPetunjuk(){
    petunjuk.classList.add('is-pudar');
  }

  /* ---------- Sensor kemiringan ---------- */
  var dasar = null;          // sudut saat pertama kali dibaca, jadi titik nol
  var pernahMiring = false;

  function padaOrientasi(e){
    if(e.beta === null && e.gamma === null) return;
    if(dasar === null){ dasar = { b: e.beta || 0, g: e.gamma || 0 }; }

    sX = jepit(((e.beta  || 0) - dasar.b) * 0.55, BATAS);
    sY = jepit(((e.gamma || 0) - dasar.g) * 0.55, BATAS);

    if(!pernahMiring && (Math.abs(sX) > 1.5 || Math.abs(sY) > 1.5)){
      pernahMiring = true;
      sembunyikanPetunjuk();
    }
    mulaiGerak();
  }

  function pasangSensor(){
    window.addEventListener('deviceorientation', padaOrientasi, true);
    mulaiGerak();
  }

  /* iOS 13 ke atas menolak sensor tanpa izin dari ketukan pengguna. */
  var tombolIzin = $('#izinGerak');
  var perluIzin = typeof DeviceOrientationEvent !== 'undefined' &&
                  typeof DeviceOrientationEvent.requestPermission === 'function';

  if(diamSaja){
    petunjuk.textContent = 'Ketuk foto untuk memperbesar';
  }else if(perluIzin){
    petunjuk.textContent = 'Izinkan akses gerak untuk melihat dinding foto bergerak';
    tombolIzin.hidden = false;
    tombolIzin.addEventListener('click', function(){
      DeviceOrientationEvent.requestPermission().then(function(hasil){
        tombolIzin.hidden = true;
        if(hasil === 'granted'){
          petunjuk.textContent = 'Miringkan perangkat Anda';
          pasangSensor();
        }else{
          petunjuk.textContent = 'Ketuk foto untuk memperbesar';
          mulaiGerak();          // tetap hidup lewat hanyutan pelan
        }
      }).catch(function(){
        tombolIzin.hidden = true;
        petunjuk.textContent = 'Ketuk foto untuk memperbesar';
        mulaiGerak();
      });
    });
  }else if('DeviceOrientationEvent' in window){
    pasangSensor();
  }

  /* ---------- Tetikus, untuk desktop ---------- */
  if(!diamSaja && window.matchMedia('(pointer: fine)').matches){
    petunjuk.textContent = 'Gerakkan kursor';
    window.addEventListener('mousemove', function(e){
      sY = jepit((e.clientX / window.innerWidth  - 0.5) *  2 * BATAS, BATAS);
      sX = jepit((e.clientY / window.innerHeight - 0.5) * -2 * BATAS, BATAS);
      if(!pernahMiring){ pernahMiring = true; sembunyikanPetunjuk(); }
      mulaiGerak();
    }, { passive: true });
  }

  /* ---------- Hanyutan pelan ----------
     Supaya dinding tidak pernah terlihat mati bila sensor tidak tersedia
     atau ditolak. Berhenti sendiri begitu ada masukan sungguhan. */
  (function hanyut(){
    if(diamSaja) return;
    var t = 0;
    var id = setInterval(function(){
      if(pernahMiring){ clearInterval(id); return; }
      t += 0.02;
      sY = Math.sin(t) * 4.5;
      sX = Math.cos(t * 0.7) * 3;
      mulaiGerak();
    }, 40);
  })();

  /* ---------- Perbesar satu foto ---------- */
  var lihat = $('#lihat');
  var gbr   = $('#lihatGbr');

  function buka(src){
    gbr.src = src;
    lihat.classList.add('is-open');
    requestAnimationFrame(function(){ lihat.classList.add('is-in'); });
  }
  function tutup(){
    lihat.classList.remove('is-in');
    setTimeout(function(){
      lihat.classList.remove('is-open');
      gbr.removeAttribute('src');      // lepaskan memori gambar besar
    }, 300);
  }

  Array.prototype.forEach.call(document.querySelectorAll('.tile'), function(t){
    t.addEventListener('click', function(){
      var im = t.querySelector('img');
      if(im) buka(im.currentSrc || im.src);
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-tutup]'), function(el){
    el.addEventListener('click', tutup);
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && lihat.classList.contains('is-open')) tutup();
  });

  /* ---------- Latar video ----------
     Baru diunduh setelah halaman selesai memuat, supaya foto yang dilihat
     tamu lebih dulu tidak berebut jalur dengan berkas video. */
  var latarVid = $('#latarVid');

  function mainkanLatar(){
    if(!latarVid || diamSaja) return;
    if(!latarVid.src && latarVid.dataset.src){ latarVid.src = latarVid.dataset.src; }
    var p = latarVid.play();
    if(p && p.catch){ p.catch(function(){}); }   // ditolak browser -> poster tetap tampil
  }

  if(!diamSaja){
    if(document.readyState === 'complete'){
      setTimeout(mainkanLatar, 400);
    }else{
      window.addEventListener('load', function(){ setTimeout(mainkanLatar, 400); });
    }
  }

  /* Hentikan animasi dan video saat halaman tidak terlihat — hemat baterai. */
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){
      jalan = false;
      if(latarVid && !latarVid.paused){ latarVid.pause(); }
    }else{
      mulaiGerak();
      if(latarVid && latarVid.src){ mainkanLatar(); }
    }
  });

  if(diamSaja){ wall.style.transform = 'translate(-50%,-50%)'; }
})();
</script>
</body>
</html>
